[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/payments/create"
  to = "/.netlify/functions/payments-create"
  status = 200

[[redirects]]
  from = "/api/payments/check"
  to = "/.netlify/functions/payments-check"
  status = 200

[[redirects]]
  from = "/api/roblox/*"
  to = "/.netlify/functions/roblox?username=:splat"
  status = 200

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
